name: Calidad
on: [push, pull_request]
permissions:
  contents: read
env:
  QT_QPA_PLATFORM: offscreen
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl libegl1 libopengl0
      - run: uv sync --locked --extra gui
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest tests/unit tests/integration
