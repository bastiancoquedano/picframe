[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "picframe"
version = "0.3.0"
description = "Reencuadre fotográfico local de personas, animales y vehículos para macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "pytest-qt==4.5.0",
    "ruff>=0.14,<1",
]

[project.scripts]
picframe = "raceframe.cli.main:main"
picframe-gui = "raceframe.ui.__main__:main"
raceframe = "raceframe.cli.main:main"
raceframe-gui = "raceframe.ui.__main__:main"

[project.optional-dependencies]
detector = [
    "opencv-python==4.13.0.92",
    "ultralytics==8.4.197",
]
gui = [
    "pyside6-essentials==6.12.0",
]
build = [
    "pyinstaller==6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raceframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: requiere pesos locales y dependencias del detector"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
