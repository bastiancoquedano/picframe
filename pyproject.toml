[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "raceframe"
version = "0.1.0"
description = "Reencuadre local y conservador de fotografía deportiva para macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
raceframe = "raceframe.cli.main:main"

[project.optional-dependencies]
detector = [
    "opencv-python==4.13.0.92",
    "ultralytics==8.4.197",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raceframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: requiere pesos locales y dependencias del detector"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
